<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">Fig 3.5 - Flow-Aware Honeypot Deployment Logic</title>
  <desc id="desc">Detected attack flow goes to Decision Engine with score at least 0.8, nftables DNAT rule inserted, attacker is transparently redirected to Cowrie port 2222, and session is logged to database.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#222222"/>
    </marker>
    <style>
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .title { font-size: 30px; font-weight: 700; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-sub { font-size: 16px; font-weight: 400; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; }
      .line { stroke: #222222; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="560" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="text title">Fig 3.5 - Flow-Aware Honeypot Deployment Logic</text>

  <g transform="translate(70 220)">
    <rect class="box" x="0" y="0" width="260" height="105"/>
    <text x="130" y="39" text-anchor="middle" class="text box-title">Detected Attack Flow</text>
    <text x="130" y="69" text-anchor="middle" class="text box-sub">src_ip:port -> dst_ip:22</text>
  </g>

  <g transform="translate(430 220)">
    <rect class="box" x="0" y="0" width="245" height="105"/>
    <text x="122.5" y="39" text-anchor="middle" class="text box-title">Decision Engine</text>
    <text x="122.5" y="69" text-anchor="middle" class="text box-sub">score >= 0.8</text>
  </g>

  <g transform="translate(775 220)">
    <rect class="box" x="0" y="0" width="270" height="105"/>
    <text x="135" y="39" text-anchor="middle" class="text box-title">nftables DNAT Rule</text>
    <text x="135" y="69" text-anchor="middle" class="text box-sub">inserted dynamically</text>
  </g>

  <g transform="translate(1145 220)">
    <rect class="box" x="0" y="0" width="310" height="105"/>
    <text x="155" y="35" text-anchor="middle" class="text box-title">Transparent Redirect</text>
    <text x="155" y="64" text-anchor="middle" class="text box-sub">attacker connects to</text>
    <text x="155" y="88" text-anchor="middle" class="text box-sub">Cowrie:2222</text>
  </g>

  <g transform="translate(1555 220)">
    <rect class="box" x="0" y="0" width="190" height="105"/>
    <text x="95" y="39" text-anchor="middle" class="text box-title">Session Logged</text>
    <text x="95" y="69" text-anchor="middle" class="text box-sub">to database</text>
  </g>

  <path class="line" d="M330 272.5 H430"/>
  <path class="line" d="M675 272.5 H775"/>
  <path class="line" d="M1045 272.5 H1145"/>
  <path class="line" d="M1455 272.5 H1555"/>
</svg>
